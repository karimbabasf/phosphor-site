<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phosphor</title>
<meta name="description" content="DeFi for everyone. The AI agent you already pay for drives your wallet. Every write is simulated, checked against your policy, and released only by your click.">
<link rel="canonical" href="https://phosphor.karimbabasf.com/">
<meta name="theme-color" content="#3FFF6C">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Phosphor">
<meta property="og:url" content="https://phosphor.karimbabasf.com/">
<meta property="og:title" content="Phosphor">
<meta property="og:description" content="DeFi for everyone. The AI agent you already pay for drives your wallet. Every write is simulated, checked against your policy, and released only by your click.">
<meta property="og:image" content="https://phosphor.karimbabasf.com/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="The Phosphor wordmark over a Roman marble bust rendered as text characters.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="/fonts/Sora-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/fonts/Sora-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face {
    font-family: "Sora";
    font-weight: 400;
    font-display: block;
    src: url("/fonts/Sora-Regular.ttf") format("truetype");
  }
  @font-face {
    font-family: "Sora";
    font-weight: 600;
    font-display: block;
    src: url("/fonts/Sora-SemiBold.ttf") format("truetype");
  }

  :root {
    --green: #3FFF6C;
    --ink: #0E0F13;
    --ink-soft: #2A2C33;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--green);
    color: var(--ink);
    font-family: "Sora", "Manrope", "Helvetica Neue", sans-serif;
    font-optical-sizing: auto;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--ink); color: var(--green); }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
    border-radius: 2px;
  }

  /* Nav */

  .nav {
    position: absolute;
    inset: 0 0 auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
  }

  .mark {
    display: block;
    line-height: 0;
  }

  .mark img {
    display: block;
    width: 25px;
    height: 30px;
  }

  .links {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .links a,
  .links button {
    font: 400 15px/1 "Sora", sans-serif;
    color: var(--ink);
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 999px;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .links a {
    text-underline-offset: 5px;
    text-decoration-color: transparent;
    transition: text-decoration-color 150ms ease;
  }

  .links button {
    font-weight: 600;
    background: var(--ink);
    color: var(--green);
    min-width: 108px;
    padding: 11px 18px;
    transition: transform 160ms var(--ease-out), background-color 150ms ease;
  }

  .links button:active { transform: scale(0.97); }

  @media (hover: hover) and (pointer: fine) {
    .links a:hover { text-decoration-line: underline; text-decoration-color: var(--ink); }
    .links button:hover { background: var(--ink-soft); }
  }

  /* Hero */

  .hero {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 96px 24px;
  }

  .wordmark {
    margin: 0;
    font-weight: 600;
    font-size: min(12.4vw, 27vh);
    line-height: 1;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  @media (min-width: 720px) {
    .nav { padding: 24px 32px; }
    .links { gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .links a, .links button { transition: none; }
  }
</style>
</head>
<body>

<header class="nav">
  <a class="mark" href="/" aria-label="Phosphor">
    <img src="/mark.svg" alt="" width="25" height="30">
  </a>
  <nav class="links" aria-label="Site">
    <a href="https://github.com/karimbabasf/phosphor">GitHub</a>
    <button type="button" id="download">Download</button>
  </nav>
</header>

<main class="hero">
  <h1 class="wordmark">Phosphor</h1>
</main>

<script>
  // No build exists yet, so Download reports a status instead of pointing at an empty release.
  const dl = document.getElementById('download');
  let timer;
  dl.addEventListener('click', () => {
    dl.textContent = 'Coming soon';
    clearTimeout(timer);
    timer = setTimeout(() => { dl.textContent = 'Download'; }, 2200);
  });
</script>

</body>
</html>
